name: Verificar proyecto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar versiones del lockfile
        run: npm ci
      - name: Comprobar tipos y generar sitio
        run: npm run build
      - name: Verificar requisitos del plan empresarial
        run: npm test
