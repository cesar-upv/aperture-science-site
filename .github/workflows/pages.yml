name: Publicar en GitHub Pages (manual)

# Uploading the repository does not publish the site. Run this workflow manually.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Preparar sitio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obtener código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Leer configuración de Pages
        uses: actions/configure-pages@v6.0.0

      - name: Instalar versiones del lockfile
        run: npm ci

      - name: Verificar requisitos del plan empresarial
        run: npm test

      - name: Comprobar tipos y generar sitio
        run: npm run build

      - name: Preparar archivos públicos
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    name: Publicar sitio
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
